name: Ayenati daily report

# Two ways in:
#   1. Commit a DE-IDENTIFIED export to data/incoming/ and push.
#   2. Run this workflow with a source_url (or set the AYENATI_SOURCE_URL secret):
#      CI downloads the RAW export, de-identifies it on the runner, shreds the
#      raw copy, then continues exactly as (1).
# Then it builds every report format, uploads an artifact, commits reports/,
# publishes GitHub Pages, and cuts a Release.
#
# SECURITY: a workflow_dispatch input is shown in the run's metadata, and this
# repo is PUBLIC. Do NOT paste a URL that embeds a token/password as source_url
# - use the AYENATI_SOURCE_URL repository secret for that (masked, not logged).

on:
  push:
    paths:
      - "data/incoming/**"
      - "scripts/ayenati_external_stats.py"
      - "scripts/ayenati_report_page.py"
      - "scripts/check_no_phi.py"
      - "scripts/fetch_export.py"
      - "scripts/deidentify_ayenati.py"
      - "labstats/export/**"
      - ".github/workflows/ayenati-report.yml"
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL of a raw export to download + de-identify (leave blank to use the AYENATI_SOURCE_URL secret, or to just reprocess data/incoming/)"
        type: string
        default: ""
      process_all:
        description: "When no URL: process every file in data/incoming/"
        type: boolean
        default: true

concurrency:
  group: ayenati-report-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install dependencies
        run: pip install -r requirements-report.txt

      - name: Fetch and de-identify a raw export from a URL
        id: fetch
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_URL: ${{ inputs.source_url != '' && inputs.source_url || secrets.AYENATI_SOURCE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCE_URL:-}" ]; then
            echo "No source_url and no AYENATI_SOURCE_URL secret - nothing to fetch."
            exit 0
          fi
          echo "::add-mask::${SOURCE_URL}"
          rawdir="${RUNNER_TEMP}/ayenati_raw"
          mkdir -p "$rawdir"
          # delete the raw download no matter how this step ends (runner VM is ephemeral too)
          trap 'rm -rf "$rawdir"' EXIT
          raw="$(python scripts/fetch_export.py "${SOURCE_URL}" "$rawdir" | tail -n1)"
          stem="$(basename "${raw%.*}")"
          out="data/incoming/${stem}.xlsx"
          python scripts/deidentify_ayenati.py "$raw" "$out"
          rm -rf "$rawdir"; trap - EXIT
          echo "Raw copy deleted. De-identified -> $out"
          echo "deid_file=$out" >> "$GITHUB_OUTPUT"

      - name: Determine which exports to process
        id: pick
        run: |
          set -euo pipefail
          if [ -n "${{ steps.fetch.outputs.deid_file }}" ]; then
            files=( "${{ steps.fetch.outputs.deid_file }}" )
            printf '%s\n' "${files[@]}"
            { echo "files<<EOF"; printf '%s\n' "${files[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          all=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.process_all }}" = "true" ]; then
            all=true
          fi
          if [ "$all" = "true" ]; then
            mapfile -t files < <(find data/incoming -maxdepth 1 -name '*.xlsx' | sort)
          else
            mapfile -t files < <(git diff --name-only --diff-filter=d "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
              | grep -E '^data/incoming/.*\.xlsx$' || true)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No changed exports detected; falling back to all files in data/incoming/."
              mapfile -t files < <(find data/incoming -maxdepth 1 -name '*.xlsx' | sort)
            fi
          fi
          printf '%s\n' "${files[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: PHI guard (fail if any incoming file still contains patient data)
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            python scripts/check_no_phi.py "$f"
          done <<< "${{ steps.pick.outputs.files }}"

      - name: Build reports
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            stem="$(basename "${f%.xlsx}")"
            echo "::group::$stem"
            python scripts/ayenati_external_stats.py "$f" "reports/$stem"
            echo "::endgroup::"
          done <<< "${{ steps.pick.outputs.files }}"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayenati-reports-${{ github.run_number }}
          path: |
            reports/**/*.xlsx
            reports/**/*.md
            reports/**/*.html
            reports/**/*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit reports (and any URL-sourced de-identified export) back
        if: github.event_name == 'push' || steps.fetch.outputs.deid_file != ''
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/incoming
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Ayenati report for ${{ github.sha }} [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Publish a GitHub Release per export
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            stem="$(basename "${f%.xlsx}")"
            dir="reports/$stem"
            tag="report-$(echo "$stem" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')"
            title="$stem"
            mapfile -t assets < <(find "$dir" -maxdepth 1 -type f \( -name '*.pdf' -o -name '*.xlsx' -o -name '*.html' -o -name '*.md' \))
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
            else
              gh release create "$tag" "${assets[@]}" --title "$title" \
                --notes "Auto-published by the Ayenati daily report workflow. Live: https://ahabalshehri.github.io/laboratory-statistics/"
            fi
          done <<< "${{ steps.pick.outputs.files }}"

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload reports/ as the Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deploy
        if: github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v4
