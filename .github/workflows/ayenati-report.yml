name: Ayenati daily report

# Drop a DE-IDENTIFIED "External LAB AYANATI" export into data/incoming/ and push.
# This workflow builds the report in every format, uploads them as a downloadable
# artifact, commits them into reports/, and publishes reports/ to GitHub Pages.

on:
  push:
    paths:
      - "data/incoming/**"
      - "scripts/ayenati_external_stats.py"
      - "scripts/ayenati_report_page.py"
      - "scripts/check_no_phi.py"
      - "labstats/export/**"
      - ".github/workflows/ayenati-report.yml"
  workflow_dispatch:
    inputs:
      process_all:
        description: "Process every file in data/incoming/ (not just changed ones)"
        type: boolean
        default: true

concurrency:
  group: ayenati-report-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install dependencies
        run: pip install -r requirements-report.txt

      - name: Determine which exports to process
        id: pick
        run: |
          set -euo pipefail
          all=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.process_all }}" = "true" ]; then
            all=true
          fi
          if [ "$all" = "true" ]; then
            mapfile -t files < <(find data/incoming -maxdepth 1 -name '*.xlsx' | sort)
          else
            mapfile -t files < <(git diff --name-only --diff-filter=d "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null \
              | grep -E '^data/incoming/.*\.xlsx$' || true)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No changed exports detected; falling back to all files in data/incoming/."
              mapfile -t files < <(find data/incoming -maxdepth 1 -name '*.xlsx' | sort)
            fi
          fi
          printf '%s\n' "${files[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: PHI guard (fail if any incoming file still contains patient data)
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            python scripts/check_no_phi.py "$f"
          done <<< "${{ steps.pick.outputs.files }}"

      - name: Build reports
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            stem="$(basename "${f%.xlsx}")"
            echo "::group::$stem"
            python scripts/ayenati_external_stats.py "$f" "reports/$stem"
            echo "::endgroup::"
          done <<< "${{ steps.pick.outputs.files }}"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayenati-reports-${{ github.run_number }}
          path: |
            reports/**/*.xlsx
            reports/**/*.md
            reports/**/*.html
            reports/**/*.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit reports back to the repo
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Ayenati report for ${{ github.sha }} [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload reports/ as the Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deploy
        if: github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v4
